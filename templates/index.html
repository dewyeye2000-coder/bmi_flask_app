<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>BMI 계산기</title>
    <style>
        body {
            font-family: "Malgun Gothic", sans-serif;
            max-width: 420px;
            margin: 60px auto;
            padding: 0 20px;
        }
        h1 {
            font-size: 24px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        label {
            font-weight: bold;
        }
        input[type="number"] {
            padding: 8px;
            font-size: 16px;
            box-sizing: border-box;
            width: 100%;
        }
        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }
        .result {
            margin-top: 24px;
            padding: 16px;
            background: #f0f7ff;
            border-radius: 8px;
        }
        .error {
            margin-top: 24px;
            padding: 16px;
            background: #ffecec;
            border-radius: 8px;
            color: #b00020;
        }
    </style>
</head>
<body>
    <h1>BMI 계산기</h1>
    <form method="POST">
        <label for="height">키 (cm)</label>
        <input type="number" step="0.1" name="height" id="height" required>

        <label for="weight">몸무게 (kg)</label>
        <input type="number" step="0.1" name="weight" id="weight" required>

        <button type="submit">계산하기</button>
    </form>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    {% if result %}
    <div class="result">
        <p>BMI 지수: <strong>{{ result.bmi }}</strong></p>
        <p>판정: <strong>{{ result.category }}</strong></p>
    </div>
    {% endif %}
</body>
</html>
